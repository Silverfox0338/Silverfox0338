  <style>
    .step {
      opacity: 0;
      animation-duration: 9s;
      animation-timing-function: ease-out;
      animation-iteration-count: infinite;
    }

    .p1 { animation-name: p1; }
    .p2 { animation-name: p2; }
    .p3 { animation-name: p3; }
    .p4 { animation-name: p4; }
    .p5 { animation-name: p5; }
    .p6 { animation-name: p6; }
    .p7 { animation-name: p7; }
    .p8 { animation-name: p8; }

    @keyframes p1 {
      0% { opacity: 0; }
      4%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p2 {
      0%, 12% { opacity: 0; }
      16%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p3 {
      0%, 22% { opacity: 0; }
      26%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p4 {
      0%, 32% { opacity: 0; }
      36%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p5 {
      0%, 42% { opacity: 0; }
      46%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p6 {
      0%, 52% { opacity: 0; }
      56%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p7 {
      0%, 62% { opacity: 0; }
      66%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes p8 {
      0%, 72% { opacity: 0; }
      76%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .step {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Toes face right; alternating rows produce the walking motion. -->
